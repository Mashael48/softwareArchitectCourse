openapi: 3.0.3

info:
  title: Hajj Permit API
  version: 1.1.0
  description: >
    Backend API for the Hajj Permit course project. Clients access the
    microservices through the Backend Gateway. Inventory request processing
    uses Redis to prevent concurrent processing of the same request.

servers:
  - url: http://localhost:3000
    description: Local Docker environment through Backend Gateway

tags:
  - name: Health
    description: Gateway health check
  - name: Entity
    description: Entity management
  - name: Inventory
    description: Permit inventory, inventory requests, and request processing locks
  - name: Permit
    description: Vehicle permit issuance and management

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check whether the gateway is running
      responses:
        "200":
          description: Gateway is running
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service:
                    type: string
                    example: gateway
                  status:
                    type: string
                    example: UP

  /entities:
    get:
      tags: [Entity]
      operationId: getEntities
      summary: Get all entities
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"

    post:
      tags: [Entity]
      operationId: createEntity
      summary: Create a new entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  example: E3
                name:
                  type: string
                  example: Riyadh Transport
                active:
                  type: boolean
                  default: true
                  example: true
      responses:
        "201":
          description: Entity created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "400":
          description: Required information is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: id and name are required
        "409":
          description: Entity already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Entity already exists

  /entities/{id}:
    get:
      tags: [Entity]
      operationId: getEntityById
      summary: Get one entity by ID
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Entity was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "404":
          description: Entity was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Entity not found

  /inventory/requests:
    get:
      tags: [Inventory]
      operationId: getInventoryRequests
      summary: Get all inventory requests
      responses:
        "200":
          description: List of inventory requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryRequest"

    post:
      tags: [Inventory]
      operationId: createInventoryRequest
      summary: Request additional permit inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryRequest"
      responses:
        "201":
          description: Inventory request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryRequest"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: entityId and positive integer amount are required

  /inventory/requests/{id}/process:
    post:
      tags: [Inventory]
      operationId: startInventoryRequestProcessing
      summary: Start processing an inventory request
      description: >
        Creates a temporary Redis processing lock. Redis SET NX ensures that
        only one processor can acquire the request at a time. The lock expires
        automatically after 120 seconds.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessorRequest"
      responses:
        "200":
          description: Processing lock acquired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingLock"
        "400":
          description: Request has already been processed or processorId is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inventory request was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another processor already holds the Redis lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingConflict"

    delete:
      tags: [Inventory]
      operationId: releaseInventoryRequestProcessing
      summary: Release an inventory request processing lock
      description: >
        Releases the temporary Redis processing lock without approving the request.
        Only the processor that owns the lock can release it.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessorRequest"
      responses:
        "200":
          description: Processing lock released
          content:
            application/json:
              schema:
                type: object
                required: [requestId, status]
                properties:
                  requestId:
                    type: string
                    example: R1
                  status:
                    type: string
                    enum: [RELEASED]
                    example: RELEASED
        "400":
          description: processorId is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request was not found or is not under processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The processing lock belongs to another processor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingConflict"

  /inventory/requests/{id}/approve:
    post:
      tags: [Inventory]
      operationId: approveInventoryRequest
      summary: Approve an inventory request
      description: >
        Approves a pending inventory request. The caller must own the Redis
        processing lock. After approval, inventory is increased and the lock is removed.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessorRequest"
      responses:
        "200":
          description: Inventory request approved and inventory increased
          content:
            application/json:
              schema:
                type: object
                required: [request, available]
                properties:
                  request:
                    $ref: "#/components/schemas/InventoryRequest"
                  available:
                    type: integer
                    example: 8
        "400":
          description: Request already processed or processorId is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inventory request was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Request is not locked or belongs to another processor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/{entityId}:
    get:
      tags: [Inventory]
      operationId: getInventoryByEntity
      summary: Get available inventory for an entity
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
          example: E1
      responses:
        "200":
          description: Current inventory for the entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"

  /inventory/consume:
    post:
      tags: [Inventory]
      operationId: consumeInventory
      summary: Consume permit inventory
      description: >
        Internal inventory operation mainly called by Permit Service when a permit is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityId]
              properties:
                entityId:
                  type: string
                  example: E1
                amount:
                  type: integer
                  minimum: 1
                  default: 1
                  example: 1
      responses:
        "200":
          description: Inventory was consumed
          content:
            application/json:
              schema:
                type: object
                required: [entityId, consumed, remaining]
                properties:
                  entityId:
                    type: string
                    example: E1
                  consumed:
                    type: integer
                    example: 1
                  remaining:
                    type: integer
                    example: 7
        "409":
          description: Not enough inventory
          content:
            application/json:
              schema:
                type: object
                required: [message, entityId, available]
                properties:
                  message:
                    type: string
                    example: Not enough inventory
                  entityId:
                    type: string
                    example: E1
                  available:
                    type: integer
                    example: 0

  /permits:
    get:
      tags: [Permit]
      operationId: getPermits
      summary: Get all issued permits
      responses:
        "200":
          description: List of issued permits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permit"

    post:
      tags: [Permit]
      operationId: issuePermit
      summary: Issue a vehicle permit
      description: >
        Validates the vehicle through the mocked NIC integration, consumes one
        inventory unit through Inventory Service, creates the permit, synchronizes
        it with the mocked Tawakkalna integration, and requests an SMS notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityId, vehiclePlate]
              properties:
                entityId:
                  type: string
                  example: E1
                vehiclePlate:
                  type: string
                  example: ABC-1234
      responses:
        "201":
          description: Permit issued successfully
          content:
            application/json:
              schema:
                type: object
                required: [permit, nic, inventory, tawakkalna]
                properties:
                  permit:
                    $ref: "#/components/schemas/Permit"
                  nic:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        example: true
                      vehiclePlate:
                        type: string
                        example: ABC-1234
                  inventory:
                    type: object
                    properties:
                      entityId:
                        type: string
                        example: E1
                      consumed:
                        type: integer
                        example: 1
                      remaining:
                        type: integer
                        example: 7
                  tawakkalna:
                    type: object
                    properties:
                      synchronized:
                        type: boolean
                        example: true
        "400":
          description: Required permit information is missing or vehicle validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Inventory could not be consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /permits/{id}:
    get:
      tags: [Permit]
      operationId: getPermitById
      summary: Get one permit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: P1
      responses:
        "200":
          description: Permit was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permit"
        "404":
          description: Permit was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      description: Entity ID
      schema:
        type: string
      example: E1

    RequestId:
      name: id
      in: path
      required: true
      description: Inventory request ID
      schema:
        type: string
      example: R1

  schemas:
    Entity:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          example: E1
        name:
          type: string
          example: Alpha Transport
        active:
          type: boolean
          example: true

    Inventory:
      type: object
      required: [entityId, available]
      properties:
        entityId:
          type: string
          example: E1
        available:
          type: integer
          example: 3

    CreateInventoryRequest:
      type: object
      required: [entityId, amount]
      properties:
        entityId:
          type: string
          example: E1
        amount:
          type: integer
          minimum: 1
          example: 5

    InventoryRequest:
      type: object
      required: [id, entityId, amount, status]
      properties:
        id:
          type: string
          example: R1
        entityId:
          type: string
          example: E1
        amount:
          type: integer
          example: 5
        status:
          type: string
          enum: [PENDING, APPROVED]
          example: PENDING

    ProcessorRequest:
      type: object
      required: [processorId]
      properties:
        processorId:
          type: string
          description: Moroor user currently processing the request
          example: moroor-1

    ProcessingLock:
      type: object
      required: [requestId, status, processorId, expiresInSeconds]
      properties:
        requestId:
          type: string
          example: R1
        status:
          type: string
          enum: [PROCESSING]
          example: PROCESSING
        processorId:
          type: string
          example: moroor-1
        expiresInSeconds:
          type: integer
          example: 120

    ProcessingConflict:
      type: object
      required: [message, requestId, processorId]
      properties:
        message:
          type: string
          example: Request is already under processing
        requestId:
          type: string
          example: R1
        processorId:
          type: string
          description: Processor currently holding the Redis lock
          example: moroor-1

    Permit:
      type: object
      required: [id, entityId, vehiclePlate, status]
      properties:
        id:
          type: string
          example: P1
        entityId:
          type: string
          example: E1
        vehiclePlate:
          type: string
          example: ABC-1234
        status:
          type: string
          enum: [ISSUED]
          example: ISSUED

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Request not found
